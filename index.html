<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulte o clima</title>
    <script src="js/index.js" defer></script>
    <link href="css/index.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <section class="painel">
        <header class="cabecalho">
          <span class="icone-clima">☀︎</span>
          <div>
            <p class="subtitulo">Previsão do tempo</p>
            <h1 class="titulo">Como está o clima?</h1>
          </div>
        </header>
        <div class="busca">
            <label for="cidade">Busque uma cidade brasileira</label>
            <div class="campo-busca"></div>
            <span>🔎︎</span>

        </div>
      </section>
      <h1>Consulte o clima</h1>
      <p>Digite uma cidade e pressione Enter:</p>

      <input id="cidade" type="text" placeholder="Ex: São Paulo" />

      <p id="mensagem"></p>
      <div id="cidades"></div>
      <div id="previsao"></div>
    </main>
  </body>
</html>
